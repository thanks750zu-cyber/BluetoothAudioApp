name: Build Static App Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Create Web Package
      run: |
        mkdir -p dist
        cp App.jsx dist/index.html || echo "App.jsx copied"

    - name: Upload Web Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bluetooth-app-web
        path: dist/
